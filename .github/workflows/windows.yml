name: windows
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
on:
  # 日常迭代只构建 Android；iOS/Windows 由 workflow_dispatch 手动触发，
  # 避免每次改一行像素都要等三端全量构建。
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Gen platform
        run: flutter create --platforms=windows --org com.zzx --project-name shoucangjia .
      # 模板测试会被 flutter create 重新生成且无法编译，删除后再跑测试闸门
      # drop the regenerated counter template test before the test gate
      - name: Drop template test
        shell: bash
        run: rm -f test/widget_test.dart; ls test | head -5
      - name: Rename window title
        shell: pwsh
        run: |
          $f='windows/runner/main.cpp'
          (Get-Content $f -Raw) -replace 'L"shoucangjia"','L"Dizi"' | Set-Content $f -Encoding UTF8
      - run: flutter pub get
      - name: App icon
        run: |
          python -m pip install --quiet pillow
          python tool/make_ico.py
      - run: flutter build windows --release
      - name: Package with version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $ver = $line.Matches.Groups[1].Value.Split('+')[0]
          if (Test-Path "build/windows/x64/runner/Release/shoucangjia.exe") { Rename-Item "build/windows/x64/runner/Release/shoucangjia.exe" "Dizi.exe" -Force }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Dizi-$ver-windows.zip" -Force
          Get-Item "Dizi-$ver-windows.zip" | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: Dizi-*-windows.zip
      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          gh release create "v$VER" --title "Dizi $VER" --notes "auto build $VER" || true
          gh release upload "v$VER" "Dizi-${VER}-windows.zip" --clobber

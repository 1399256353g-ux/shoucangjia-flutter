name: windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Gen platform
        run: flutter create --platforms=windows --org com.zzx --project-name shoucangjia .
      - name: Rename window title
        shell: pwsh
        run: |
          $f='windows/runner/main.cpp'
          (Get-Content $f -Raw) -replace 'L"shoucangjia"','L"Didi"' | Set-Content $f -Encoding UTF8
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows/x64/runner/Release/

name: windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Gen platform
        run: flutter create --platforms=windows --org com.zzx --project-name shoucangjia .
      - name: Rename window title
        shell: pwsh
        run: |
          $f='windows/runner/main.cpp'
          (Get-Content $f -Raw) -replace 'L"shoucangjia"','L"Dizi"' | Set-Content $f -Encoding UTF8
      - run: flutter pub get
      - name: App icon
        run: |
          python -m pip install --quiet pillow
          python tool/make_ico.py
      - run: flutter build windows --release
      - name: Package with version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $ver = $line.Matches.Groups[1].Value.Split('+')[0]
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Dizi-$ver-windows.zip" -Force
          Get-Item "Dizi-$ver-windows.zip" | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: Dizi-*-windows.zip

name: android
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Gen platform
        run: flutter create --platforms=android,ios --org com.zzx --project-name shoucangjia .
      # 模板测试会被 flutter create 重新生成且无法编译，删除后再跑测试闸门
      # drop the regenerated counter template test before the test gate
      - name: Drop template test
        run: rm -f test/widget_test.dart; ls test | head -5
      # 测试闸门：三端统一用 bash（Windows runner 也走 git-bash），
      # 只跑自己的套件、输出精简，避免 pwsh/代码页把中文输出读崩。
      - name: Flutter tests
        shell: bash
        run: flutter test -r compact
      - name: Patch manifest (INTERNET + cleartext)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s=s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s=s.replace('android:label="shoucangjia"','android:label="Dizi"')
          if 'android:label="Dizi"' not in s:
              s=s.replace('<application', '<application android:label="Dizi"', 1)
          open(p,'w').write(s)
          print(s[:400])
          PY
      - name: Disable AGP lintVital (lint detector crash inside plugin modules)
        run: |
          python3 - <<'PY2'
          import os
          p = 'android/build.gradle' if os.path.exists('android/build.gradle') else 'android/build.gradle.kts'
          s = open(p).read()
          groovy = """
          subprojects { sp ->
              sp.tasks.configureEach { t ->
                  if (t.name.toLowerCase().contains('lintvital')) { t.enabled = false }
              }
          }
          """
          kts = """
          subprojects {
              tasks.matching { it.name.contains("lintVital", ignoreCase = true) }.configureEach { enabled = false }
          }
          """
          block = groovy if p.endswith('.gradle') else kts
          if 'lintvital' not in s.lower():
              s = s.rstrip() + '\n' + block + '\n'
              open(p, 'w').write(s)
          print(open(p).read()[-400:])
          PY2
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      # 固定签名（结构性修复）：`flutter create` 生成的模板把 release 指向
      # `signingConfigs.getByName("debug")`，而 release APK 落到 runner 的临时
      # debug keystore —— 每次构建签名都不同，`adb install -r -d` 必然
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能每轮 uninstall + 备份 + 恢复。
      # 这里注入长期 keystore，之后同一台设备可以直接覆盖安装。
      - name: Install release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置，拒绝构建无固定签名的包"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/dizi-release.p12
          test -s android/keystore/dizi-release.p12
          ls -l android/keystore
      - name: Patch signing config
        env:
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          python3 - <<'PY'
          import os
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'diziRelease' in s:
              print('already patched')
              raise SystemExit(0)
          store, key = os.environ['KS_PASS'], os.environ['KEY_PASS']
          alias = os.environ.get('KEY_ALIAS') or 'dizi'
          # 1) 在 android{} 块前声明 release signingConfig
          sign_block = '''
          android {
              signingConfigs {
                  create("diziRelease") {
                      storeFile = file("../keystore/dizi-release.p12")
                      storePassword = "%s"
                      keyAlias = "%s"
                      keyPassword = "%s"
                      storeType = "PKCS12"
                  }
              }
          ''' % (store, alias, key)
          s = s.replace('android {', sign_block, 1)
          # 2) release 用固定签名，不再用 runner 的临时 debug key
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("diziRelease")')
          assert 'diziRelease' in s
          open(p, 'w').write(s)
          print(s[:900])
          PY
      - name: Build APK (retry once)
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000
        run: |
          flutter build apk --release || flutter build apk --release
      - name: Verify signing certificate is stable
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          echo "apksigner: $SIGNER"
          "$SIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          FOUND=$(grep -oE 'SHA-256 digest: [0-9a-f]+' /tmp/certs.txt | head -1 | awk '{print $3}')
          EXPECTED="feb4574570872cfa7fa35761f1262e6a3da6d4c642fb335227d5b5c829e25db8"
          echo "signing sha256: $FOUND"
          if [ "$FOUND" != "$EXPECTED" ]; then
            echo "::error::APK 签名指纹与固定 keystore 不一致（$FOUND），覆盖安装会失败"
            exit 1
          fi
          echo "签名指纹与固定 keystore 一致，可直接 install -r -d 覆盖安装"
      - name: Rename APK with version
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "Dizi-${VER}-android.apk"
          ls -lh Dizi-${VER}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Dizi-*-android.apk
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          gh release create "v$VER" --title "Dizi $VER" --notes "auto build $VER" || true
          gh release upload "v$VER" "Dizi-${VER}-android.apk" --clobber

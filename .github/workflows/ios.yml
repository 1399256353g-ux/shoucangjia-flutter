name: ios
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Gen platform
        run: flutter create --platforms=ios,android --org com.zzx --project-name shoucangjia .
      # 模板测试会被 flutter create 重新生成且无法编译，删除后再跑测试闸门
      # drop the regenerated counter template test before the test gate
      - name: Drop template test
        run: rm -f test/widget_test.dart; ls test | head -5
      - name: ATS
        run: |
          PL=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 访问局域网图库" "$PL" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Dizi" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Dizi" "$PL"
      - name: Photo permissions
        run: |
          PL=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 选择本地图片作为库封面" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 拍摄图片作为库封面" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 保存图片" "$PL" || true
      - name: Ensure iOS min version (image_picker)
        run: |
          P=ios/Podfile
          if [ -f "$P" ]; then
            if grep -q '^# platform :ios' "$P"; then
              sed -i '' "s/^# platform :ios.*/platform :ios, '12.0'/" "$P"
            fi
            if ! grep -q '^platform :ios' "$P"; then
              awk 'NR==1{print; print "platform :ios, '"'"'12.0'"'"'"; next} {print}' "$P" > "$P.tmp" && mv "$P.tmp" "$P"
            fi
            grep -n 'platform :ios' "$P"
          fi
      - name: Verify Info.plist permissions
        run: |
          PL=ios/Runner/Info.plist
          for k in NSPhotoLibraryUsageDescription NSCameraUsageDescription; do
            V=$(/usr/libexec/PlistBuddy -c "Print :$k" "$PL") || { echo "MISSING $k"; exit 1; }
            echo "$k = $V"
          done
          echo "INFO_PLIST_OK"
      - name: Audio config (background playback)
        run: |
          PL=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PL" || true
          /usr/libexec/PlistBuddy -c "Set :UIBackgroundModes:0 audio" "$PL" 2>/dev/null || true
          python3 - <<'PY'
          import re
          p = 'ios/Runner/AppDelegate.swift'
          s = open(p, encoding='utf-8').read()
          if 'AVAudioSession' not in s:
              if 'import AVFoundation' not in s:
                  if 'import Flutter' in s:
                      s = s.replace('import Flutter', 'import Flutter\nimport AVFoundation', 1)
                  else:
                      s = 'import AVFoundation\n' + s
              cfg = ('    try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .moviePlayback)\n'
                     '    try? AVAudioSession.sharedInstance().setActive(true)\n')
              m = re.search(r'didFinishLaunchingWithOptions', s)
              if m:
                  i = s.find('{', m.end())
                  s = s[:i + 1] + '\n' + cfg + s[i + 1:]
              else:
                  j = s.rfind('}')
                  add = ('\n  override func application(\n'
                         '    _ application: UIApplication,\n'
                         '    didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?\n'
                         '  ) -> Bool {\n'
                         '    GeneratedPluginRegistrant.register(with: self)\n' + cfg +
                         '    return super.application(application, didFinishLaunchingWithOptions: launchOptions)\n'
                         '  }\n')
                  s = s[:j] + add + s[j:]
              open(p, 'w', encoding='utf-8').write(s)
          print('AppDelegate patched')
          PY
      - name: Verify audio config
        run: |
          PL=ios/Runner/Info.plist
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PL" | grep -q 'audio'; then
            echo "MISSING UIBackgroundModes audio"; exit 1
          fi
          if ! grep -q "AVAudioSession" ios/Runner/AppDelegate.swift; then
            echo "MISSING AVAudioSession in AppDelegate"; exit 1
          fi
          echo "AUDIO_CFG_OK"
      - run: flutter pub get
      - name: Validate workflow YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml,sys;yaml.safe_load(open(sys.argv[1]))" .github/workflows/ios.yml

      - name: Flutter tests
        run: flutter test -r compact
      - run: dart run flutter_launcher_icons
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "Dizi-${VER}-unsigned.ipa" Payload
          ls -lh Dizi-${VER}-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Dizi-*-unsigned.ipa
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          gh release create "v$VER" --title "Dizi $VER" --notes "auto build $VER" || true
          gh release upload "v$VER" "Dizi-${VER}-unsigned.ipa" --clobber
